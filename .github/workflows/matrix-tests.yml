# This matrix testing is for versions not already exercised by tests.yml
# For regular pushes, we just test the minimum Python version, but when pushing
# to main or release, we want to exercise the full matrix.
name: Run Matrix Tests
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: main

concurrency:
  group: ${{ github.workflow }}-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6 # @v3.1, with tool cache
        if: runner.os != 'macOS'
        id: ffmpeg
        continue-on-error: true
      - run: brew install ffmpeg
        if: runner.os == 'macOS'
      - name: Alternate way to install ffmpeg on Linux, if needed, with apt-get
        if: steps.ffmpeg.outcome == 'failure' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install ffmpeg
      - uses: prefix-dev/setup-pixi@v0.11.2  # Immutable
        if: steps.ffmpeg.outcome == 'failure' && runner.os == 'Windows'
        with:
          run-install: false
      - name: Alternate way to install ffmpeg on Windows, if needed, with pixi
        if: steps.ffmpeg.outcome == 'failure' && runner.os == 'Windows'
        run: pixi global install ffmpeg
      - run: ffmpeg -version
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: |
          pip install --group dev -e .
      - name: Run tests
        run: pytest
